# docker compose up -d   ->   UI and API on http://localhost:8000
# Everything is set up in the web UI (key, models, MQTT, meters) and kept in the volume below.
# Optional: copy .env.example to .env (LLM_API_KEY), or start from a file: see config/config.example.yml.
services:
  zaehler-agent:
    image: ghcr.io/dominikludwig1995/zaehler-agent:latest
    build: .   # `docker compose up -d --build` builds from source instead of pulling
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      # READ_ONLY: "true"   # show everything, change nothing
    volumes:
      - zaehler-data:/data
      # - ./config/config.yml:/app/config/config.yml:ro   # optional: start from a file

  # Optional: a local broker, if you have none. Point mqtt.host at "mosquitto" and enable it with
  #   docker compose --profile mqtt up -d
  mosquitto:
    image: eclipse-mosquitto:2@sha256:fa12172a051310efe5bcb7a6a11b77bd5faacb82cbacd7742aa758bf024fd8e4
    profiles: [mqtt]
    restart: unless-stopped
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf

volumes:
  zaehler-data:
