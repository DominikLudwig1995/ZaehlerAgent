<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>zaehler-agent</title>
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--fg:#141a26;--mut:#6b7587;--line:#e3e7ee;--soft:#f0f3f8;
  --acc:#2f6bff;--ok:#12a150;--warn:#d98a00;--bad:#d9362b;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.05);
  --gas:#e8863a;--water:#2f9bff;--electricity:#c9a400;--heat:#d9362b;--generic:#7a63ff;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1117;--card:#161c26;--fg:#e8ecf3;--mut:#8b96a9;--line:#263041;--soft:#1d2531;
  --acc:#6b9bff;--ok:#2fc272;--warn:#f0a928;--bad:#ff6a5e;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0}
header h1{font-size:19px;margin:0;letter-spacing:-.01em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12.5px;color:var(--mut)}
.chip b{color:var(--fg);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;width:70px;display:inline-block;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.top{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 6px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--accent,var(--acc))}
.title{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.val{font-size:40px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.unit{font-size:18px;color:var(--mut);font-weight:500;margin-left:6px}
.status{margin-left:auto;text-align:right}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:600;color:#fff;background:var(--mut)}
.pill.accepted{background:var(--ok)}.pill.unchanged{background:#6aa6ff}.pill.rejected{background:var(--warn)}.pill.error{background:var(--bad)}
.age{color:var(--mut);font-size:12.5px;margin-top:6px}
.reason{padding:0 20px;color:var(--mut);font-size:13px;min-height:20px}
.reads{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px 0}
.read{background:var(--soft);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--mut)}
.read code{display:block;font-size:15px;color:var(--fg);letter-spacing:.14em;font-weight:600}
.read.cam code{opacity:.65}
.chart{padding:8px 12px 0;position:relative}
.chart svg{width:100%;height:120px;display:block}
.chart .empty{height:120px;display:grid;place-items:center;color:var(--mut);font-size:13px}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 20px 0}
.pics figure{margin:0}
.pics img{width:100%;border-radius:8px;border:1px solid var(--line);background:var(--soft);display:block;cursor:zoom-in;min-height:40px;object-fit:contain;max-height:200px}
.pics figcaption{font-size:11.5px;color:var(--mut);margin-top:4px}
.actions{display:flex;gap:8px;padding:14px 20px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:13.5px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 13px;cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.55;cursor:wait}
.msg{font-size:12.5px;color:var(--mut)}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;padding:11px 20px;color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--mut);font-weight:500;text-align:left;padding:5px 20px}
td{padding:6px 20px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
td.n{text-align:right}
.dlg{position:fixed;inset:0;background:rgba(10,14,22,.72);display:none;place-items:center;z-index:9;padding:20px}
.dlg.on{display:grid}.dlg img{max-width:100%;max-height:92vh;border-radius:8px}
.set{display:none;gap:8px;align-items:center;padding:0 20px 14px}
.set.on{display:flex}.set input{font:inherit;width:140px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.nav{display:flex;gap:4px;background:var(--soft);border-radius:10px;padding:3px}
.nav a{padding:5px 13px;border-radius:8px;color:var(--mut);text-decoration:none;font-size:13.5px}
.nav a.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.panel h2{font-size:16px;margin:0 0 4px}.panel p.hint{margin:0 0 14px;color:var(--mut);font-size:13px}
.form{display:grid;gap:12px 16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut)}
.form input,.form select,.form textarea{font:inherit;font-size:14px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.form .wide{grid-column:1/-1}.form textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.mrow{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}.mrow .t{font-weight:600}.mrow .u{color:var(--mut);font-size:12.5px;word-break:break-all}
.mrow .sp{margin-left:auto;display:flex;gap:8px}
button.danger{color:var(--bad);border-color:var(--bad)}
.crop{position:relative;display:inline-block;max-width:100%;touch-action:none;user-select:none;margin-top:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.crop img{display:block;max-width:100%;height:auto;cursor:crosshair}
.crop .box{position:absolute;border:2px solid var(--acc);background:rgba(47,107,255,.15);pointer-events:none}
.result{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--soft);font-size:13px}
.result code{font-size:17px;letter-spacing:.14em;font-weight:600}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-bottom:14px;font-size:13px;color:var(--mut)}
@media (max-width:520px){.val{font-size:32px}.pics{grid-template-columns:1fr}.chips{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>zaehler-agent</h1>
    <nav class="nav"><a href="#/" data-v="dash">Dashboard</a><a href="#/meters" data-v="meters">Meters</a><a href="#/settings" data-v="settings">Settings</a></nav>
    <div class="chips" id="chips"></div></header>
  <div class="grid" id="meters"></div>
  <div id="manage" hidden></div>
</div>
<div class="dlg" id="dlg"><img id="big" alt=""></div>
<script>
const COLORS={gas:"--gas",water:"--water",electricity:"--electricity",heat:"--heat",generic:"--generic"};
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.textContent=h;return e};
const ago=(ts)=>{const s=Math.max(0,Math.round(Date.now()/1000-ts));return s<90?s+" s ago":s<5400?Math.round(s/60)+" min ago":s<172800?Math.round(s/3600)+" h ago":Math.round(s/86400)+" d ago"};
const fmt=(v,d)=>v==null?"-":Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}).replace(/,/g," ");
const NS="http://www.w3.org/2000/svg";
const sv=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e};
function chart(series,decimals){
  const box=$("div","chart");
  if(series.length<2){box.append($("div","empty","The curve appears after a few readings"));return box}
  const W=560,H=120,L=8,R=8,T=10,B=22,xs=series.map(p=>p[0]),ys=series.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.min(...ys),y1=Math.max(...ys);
  if(y1-y0<1e-9){y0-=.5;y1+=.5}
  const X=x=>L+(x-x0)/((x1-x0)||1)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  const s=sv("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none"});
  s.style.color="var(--accent)";
  const pts=series.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1));
  const area=sv("polygon",{points:`${X(x0)},${H-B} ${pts.join(" ")} ${X(x1)},${H-B}`,fill:"currentColor","fill-opacity":".12"});
  const line=sv("polyline",{points:pts.join(" "),fill:"none",stroke:"currentColor","stroke-width":2.2,"stroke-linejoin":"round","vector-effect":"non-scaling-stroke"});
  s.append(area,line);
  const mk=(txt,x,anchor)=>{const t=sv("text",{x,y:H-6,"text-anchor":anchor,"font-size":11,fill:"var(--mut)"});t.textContent=txt;return t};
  const hh=x=>new Date(x*1000).toLocaleString([], {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  s.append(mk(hh(x0),L,"start"),mk(fmt(y0,decimals)+" - "+fmt(y1,decimals),W/2,"middle"),mk(hh(x1),W-R,"end"));
  box.append(s);return box}
function digits(label,txt,cls){const r=$("div","read"+(cls?" "+cls:""));r.append(document.createTextNode(label));r.append($("code","",txt||"-"));return r}
async function api(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(r.status);return r.json()}
function card(m,s,h){
  const c=$("section","card");c.style.setProperty("--accent",`var(${COLORS[m.kind]||"--acc"})`);
  const top=$("div","top");top.append($("span","dot"));
  const left=$("div");left.append($("div","title",m.title));
  const v=$("div","val",fmt(s.value,m.decimals));v.append($("span","unit",m.unit));left.append(v);top.append(left);
  const st=$("div","status");st.append($("span","pill "+(s.status||""),s.status||"starting"));
  const upd=h.readings.length?ago(h.readings[0].ts):"no reading yet";st.append($("div","age","last reading "+upd));top.append(st);c.append(top);
  c.append($("div","reason",s.reason||""));
  const rd=$("div","reads");
  rd.append(digits("voted",s.digits));
  (s.samples||[]).forEach((x,i)=>rd.append(digits((s.models||[])[i]?s.models[i].split("/").pop():"model "+(i+1),x)));
  if(s.device_reading)rd.append(digits("camera's own",s.device_reading,"cam"));
  c.append(rd);
  c.append(chart(h.series,m.decimals));
  const pics=$("div","pics");
  for(const [crop,cap] of [[false,"camera picture"],[true,"what the models see"]]){
    const f=$("figure"),i=$("img");i.alt=cap;i.src="api/image/"+m.name+"?crop="+crop+"&t="+Date.now();
    i.onerror=()=>{f.style.display="none"};i.onclick=()=>{document.getElementById("big").src=i.src;document.getElementById("dlg").classList.add("on")};
    f.append(i,$("figcaption","",cap));pics.append(f)}
  c.append(pics);
  const set=$("div","set"),inp=$("input");inp.type="number";inp.step="any";inp.placeholder=fmt(s.value,m.decimals);
  const ok=$("button","primary","Set value");set.append(inp,ok,$("span","msg","what the counter really shows"));
  const act=$("div","actions"),msg=$("span","msg");
  const rb=$("button","primary","Read now"),sb=$("button","","Set value by hand...");
  rb.onclick=async()=>{rb.disabled=true;msg.textContent="reading (two models)...";try{await api("poll/"+m.name,{method:"POST"});await render()}catch(e){msg.textContent="failed: "+e.message;rb.disabled=false}};
  sb.onclick=()=>{set.classList.toggle("on");inp.focus()};
  ok.onclick=async()=>{const x=parseFloat(inp.value);if(isNaN(x))return;if(!confirm("Set "+m.title+" to "+x+" "+m.unit+"?"))return;
    try{await api("api/meters/"+m.name+"/value",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({value:x})});await render()}catch(e){msg.textContent="failed: "+e.message}};
  if(!CFG.read_only)act.append(rb,sb);act.append(msg);c.append(act,set);
  const det=$("details");det.append($("summary","","History ("+h.readings.length+" latest readings)"));
  const t=$("table"),hr=$("tr");["when","result","digits / reason","cost USD"].forEach(x=>hr.append($("th","",x)));t.append(hr);
  for(const r of h.readings){const tr=$("tr");[ago(r.ts),r.status,r.digits||r.reason||"-"].forEach(x=>tr.append($("td","",x)));tr.append($("td","n",r.cost.toFixed(4)));t.append(tr)}
  det.append(t);c.append(det);return c}
let busy=false;
async function render(){
  if(busy)return;busy=true;
  try{
    const [cfg,st]=await Promise.all([api("api/config"),api("status")]);CFG=cfg;
    const chips=document.getElementById("chips");chips.replaceChildren();
    const chip=(a,b)=>{const e=$("span","chip",a+" ");e.append($("b","",b));chips.append(e);return e};
    chip("models",cfg.models.map(x=>x.split("/").pop()).join(", "));
    chip("every",Math.round(cfg.interval_seconds/60)+" min");
    const bud=chip("cost today",cfg.cost_today_usd.toFixed(3)+" / "+cfg.max_daily_cost_usd.toFixed(2)+" USD");
    const bar=$("span","bar"),fill=$("i");fill.style.width=Math.min(100,cfg.cost_today_usd/cfg.max_daily_cost_usd*100)+"%";bar.append(fill);bud.append(bar);
    chip("MQTT",cfg.mqtt?"on":"off");
    const root=document.getElementById("meters");const cards=[];
    for(const m of cfg.meters){const h=await api("api/history/"+m.name+"?limit=15");cards.push(card(m,st[m.name]||{},h))}
    root.replaceChildren(...cards);
  }catch(e){document.getElementById("meters").textContent="Cannot load: "+e.message}
  busy=false}
document.getElementById("dlg").onclick=e=>e.currentTarget.classList.remove("on");

/* ---- views --------------------------------------------------------------------------------- */
let CFG=null;
const sh=(el,on)=>{el.hidden=!on};
function route(){
  const v=location.hash.startsWith("#/meters")?"meters":location.hash.startsWith("#/settings")?"settings":"dash";
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  sh(document.getElementById("meters"),v==="dash");sh(document.getElementById("manage"),v!=="dash");
  if(v==="meters")viewMeters();else if(v==="settings")viewSettings();else render()}
window.addEventListener("hashchange",route);
function ro(root){if(CFG&&CFG.read_only){root.prepend($("div","banner","Read-only instance: changes are disabled (READ_ONLY=true)."));}}
async function send(method,url,body){
  const r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});
  const t=await r.text();let j;try{j=JSON.parse(t)}catch{j=null}
  if(!r.ok)throw new Error((j&&j.detail)||t||r.status);return j}
function field(label,el,wide){const l=$("label",wide?"wide":"",label);l.append(el);return l}
function inp(type,val,extra){const i=$("input");i.type=type;if(val!==undefined&&val!==null)i.value=val;if(type==="number")i.step="any";Object.assign(i,extra||{});return i}

/* ---- meters ------------------------------------------------------------------------------- */
async function viewMeters(){
  const root=document.getElementById("manage");root.replaceChildren();
  CFG=await api("api/settings");ro(root);
  const p=$("section","panel");p.append($("h2","","Meters"),$("p","hint","One meter = one camera looking at one counter. Changes apply at once; Home Assistant gets or loses the sensor."));
  for(const m of CFG.meters){
    const r=$("div","mrow"),i=$("div");i.append($("div","t",m.title+"  ("+m.name+")"),$("div","u",m.image_url));r.append(i);
    const sp=$("div","sp"),e=$("button","","Edit"),d=$("button","danger","Delete");
    e.onclick=()=>editMeter(m);d.onclick=async()=>{if(!confirm("Delete meter "+m.title+"? Its Home Assistant sensor is removed."))return;try{await send("DELETE","api/meters/"+m.name);viewMeters()}catch(x){alert(x.message)}};
    if(!CFG.read_only)sp.append(e,d);r.append(sp);p.append(r)}
  if(!CFG.read_only){const a=$("button","primary","Add meter");a.onclick=()=>editMeter(null);const w=$("div","row");w.append(a);p.append(w)}
  root.append(p);const ed=$("div");ed.id="editor";root.append(ed)}
function editMeter(m){
  const isNew=!m;m=m||{name:"",title:"",kind:"water",image_url:"",integer_digits:5,decimals:3,crop:null,rotate:0,mirror:false,max_rate_per_hour:2,image_headers:{},device_json_url:"",initial_value:null};
  const box=document.getElementById("editor");box.replaceChildren();
  const p=$("section","panel");p.append($("h2","",isNew?"Add meter":"Edit "+m.title));
  const f={};const form=$("div","form");
  f.name=inp("text",m.name,{placeholder:"water",disabled:!isNew});f.title=inp("text",m.title,{placeholder:"Water meter"});
  f.kind=$("select");["gas","water","electricity","heat","generic"].forEach(k=>{const o=$("option","",k);o.value=k;f.kind.append(o)});f.kind.value=m.kind;
  f.image_url=inp("url",m.image_url,{placeholder:"http://192.168.1.50/img_tmp/raw.jpg"});
  f.integer_digits=inp("number",m.integer_digits);f.decimals=inp("number",m.decimals);
  f.max_rate=inp("number",m.max_rate_per_hour);f.initial=inp("number",m.initial_value);
  f.rotate=inp("number",m.rotate);f.mirror=$("select");[["false","no"],["true","yes"]].forEach(([v,t])=>{const o=$("option","",t);o.value=v;f.mirror.append(o)});f.mirror.value=String(!!m.mirror);
  f.crop=inp("text",m.crop?m.crop.join(","):"",{placeholder:"x0,y0,x1,y1 (draw it on the picture)"});
  f.device=inp("url",m.device_json_url,{placeholder:"optional: AI-on-the-edge /json"});
  f.headers=$("textarea");f.headers.value=Object.entries(m.image_headers||{}).map(([k,v])=>k+": "+v).join("\n");f.headers.placeholder="Authorization: Bearer ...  (one per line, optional)";
  [["Name (id)",f.name],["Title",f.title],["Kind",f.kind],["Picture URL",f.image_url,1],["Whole-number wheels",f.integer_digits],["Decimal wheels",f.decimals],
   ["Max. rise per hour",f.max_rate],["Start value (optional)",f.initial],["Rotate (deg, counter-clockwise)",f.rotate],["Mirror",f.mirror],["Crop of the digit row",f.crop,1],
   ["Camera's own reading URL",f.device,1],["Request headers",f.headers,1]].forEach(([l,e,w])=>form.append(field(l,e,w)));
  p.append(form);
  const stage=$("div"),res=$("div");
  const body=()=>{const h={};f.headers.value.split("\n").forEach(l=>{const i=l.indexOf(":");if(i>0)h[l.slice(0,i).trim()]=l.slice(i+1).trim()});
    const c=f.crop.value.trim()?f.crop.value.split(",").map(x=>Math.round(parseFloat(x))):null;
    return {name:f.name.value||"test",title:f.title.value||f.name.value,kind:f.kind.value,image_url:f.image_url.value,integer_digits:+f.integer_digits.value,decimals:+f.decimals.value,
      max_rate_per_hour:+f.max_rate.value,initial_value:f.initial.value===""?null:+f.initial.value,rotate:+f.rotate.value||0,mirror:f.mirror.value==="true",crop:c,
      device_json_url:f.device.value,image_headers:h}};
  const probeUrl=(crop)=>{const b=body();const q=new URLSearchParams({url:b.image_url,rotate:b.rotate,mirror:b.mirror,headers:Object.entries(b.image_headers).map(([k,v])=>k+": "+v).join("\n")});if(crop&&b.crop)q.set("crop",b.crop.join(","));q.set("t",Date.now());return "api/probe?"+q};
  function showPicture(){
    stage.replaceChildren();const w=$("div","crop"),img=$("img"),bx=$("div","box");img.src=probeUrl(false);img.draggable=false;
    img.onerror=()=>{stage.replaceChildren($("div","result","Cannot load the picture. Check the URL and that the agent can reach the camera."))};
    w.append(img,bx);stage.append($("div","msg","Draw a rectangle around the digit row."),w);
    const place=()=>{const c=f.crop.value.split(",").map(Number);if(c.length!==4||c.some(isNaN)||!img.naturalWidth){bx.style.display="none";return}
      const k=img.clientWidth/img.naturalWidth;Object.assign(bx.style,{display:"block",left:c[0]*k+"px",top:c[1]*k+"px",width:(c[2]-c[0])*k+"px",height:(c[3]-c[1])*k+"px"})};
    img.onload=place;f.crop.oninput=place;let st=null;
    const pt=e=>{const r=img.getBoundingClientRect(),k=img.naturalWidth/r.width;return [Math.max(0,Math.min(img.naturalWidth,Math.round((e.clientX-r.left)*k))),Math.max(0,Math.min(img.naturalHeight,Math.round((e.clientY-r.top)*k)))]};
    w.onpointerdown=e=>{st=pt(e);w.setPointerCapture(e.pointerId)};
    w.onpointermove=e=>{if(!st)return;const c=pt(e);f.crop.value=[Math.min(st[0],c[0]),Math.min(st[1],c[1]),Math.max(st[0],c[0]),Math.max(st[1],c[1])].join(",");place()};
    w.onpointerup=()=>{st=null}}
  const row=$("div","row");
  const load=$("button","","Load picture"),prev=$("button","","Preview what the models see"),test=$("button","","Test read"),save=$("button","primary","Save"),cancel=$("button","","Cancel");
  load.onclick=showPicture;
  prev.onclick=()=>{stage.replaceChildren();const i=$("img");i.src=probeUrl(true);i.style.maxWidth="100%";i.style.borderRadius="8px";i.onerror=()=>stage.replaceChildren($("div","result","No preview: load the picture and draw the crop first."));stage.append($("div","msg","This is exactly what the models get (contrast stretched, 2x enlarged)."),i)};
  test.onclick=async()=>{test.disabled=true;res.replaceChildren($("div","result","reading with "+CFG.models.length+" model(s)..."));
    try{const r=await send("POST","api/meters/test",body());const d=$("div","result");
      if(!r.ok)d.textContent="Failed: "+r.error;else{d.append("voted ");d.append($("code","",r.digits));d.append(document.createTextNode("   per model: "+r.samples.join(" / ")+"   agreement "+Math.round(r.agreement*100)+"%   cost "+r.cost_usd+" USD"))}
      res.replaceChildren(d)}catch(x){res.replaceChildren($("div","result","Failed: "+x.message))}test.disabled=false};
  save.onclick=async()=>{try{const b=body();if(isNew)await send("POST","api/meters",b);else await send("PUT","api/meters/"+m.name,b);viewMeters()}catch(x){res.replaceChildren($("div","result","Not saved: "+x.message))}};
  cancel.onclick=()=>box.replaceChildren();
  row.append(load,prev,test,save,cancel);p.append(row,stage,res);box.append(p);box.scrollIntoView({behavior:"smooth"});
  if(f.image_url.value)showPicture()}

/* ---- settings ----------------------------------------------------------------------------- */
async function viewSettings(){
  const root=document.getElementById("manage");root.replaceChildren();
  CFG=await api("api/settings");ro(root);const S=CFG;
  const p=$("section","panel");p.append($("h2","","Vision models"),$("p","hint","Any OpenAI-compatible chat API with picture input: OpenRouter, OpenAI, a local Ollama or vLLM. Every model reads each picture, the digits are voted wheel by wheel, so use different models."));
  const f={};const form=$("div","form");
  f.url=inp("url",S.llm_base_url);f.key=inp("password","",{placeholder:S.llm_api_key_set?"set (leave empty to keep)":"not set",autocomplete:"off"});
  f.models=$("textarea");f.models.value=S.models.join("\n");
  f.interval=inp("number",Math.round(S.interval_seconds/60));f.budget=inp("number",S.max_daily_cost_usd);
  [["API base URL",f.url,1],["API key",f.key],["Check every (minutes)",f.interval],["Daily budget (USD)",f.budget],["Models (one per line)",f.models,1]].forEach(([l,e,w])=>form.append(field(l,e,w)));
  p.append(form);
  const q=$("section","panel");q.append($("h2","","Home Assistant (MQTT)"),$("p","hint","Leave the host empty to run without MQTT. Sensors appear in Home Assistant by themselves (MQTT discovery)."));
  const g=$("div","form");f.mh=inp("text",S.mqtt_host,{placeholder:"192.168.1.10"});f.mp=inp("number",S.mqtt_port);f.mu=inp("text",S.mqtt_user);f.mw=inp("password","",{placeholder:S.mqtt_password_set?"set (leave empty to keep)":"not set",autocomplete:"off"});
  f.tp=inp("text",S.topic_prefix);f.dp=inp("text",S.discovery_prefix);
  [["Host",f.mh],["Port",f.mp],["User",f.mu],["Password",f.mw],["Topic prefix",f.tp],["Discovery prefix",f.dp]].forEach(([l,e])=>g.append(field(l,e)));q.append(g);
  const res=$("div"),row=$("div","row");
  const save=$("button","primary","Save"),exp=$("a"),rst=$("button","danger","Reset to file / environment");
  save.onclick=async()=>{try{const out=await send("PUT","api/settings",{llm_base_url:f.url.value,llm_api_key:f.key.value,models:f.models.value,interval_seconds:Math.round(+f.interval.value*60),max_daily_cost_usd:+f.budget.value,
      mqtt_host:f.mh.value,mqtt_port:+f.mp.value,mqtt_user:f.mu.value,mqtt_password:f.mw.value,topic_prefix:f.tp.value,discovery_prefix:f.dp.value});
      res.replaceChildren($("div","result",out.persistent?"Saved. It survives restarts.":"Saved until the next restart (no data directory: set DATA_DIR and mount a volume to keep it)."));f.key.value="";f.mw.value=""}catch(x){res.replaceChildren($("div","result","Not saved: "+x.message))}};
  exp.href="api/settings/export";exp.textContent="Download as config.yml";exp.className="msg";exp.download="config.yml";
  rst.onclick=async()=>{if(!confirm("Forget everything edited here and go back to the config file and the environment?"))return;try{await send("DELETE","api/settings");viewSettings()}catch(x){alert(x.message)}};
  if(!S.read_only)row.append(save,rst);row.append(exp);
  root.append(p,q,row,res)}

route();setInterval(()=>{if(!document.hidden&&!location.hash.match(/meters|settings/)&&!document.querySelector(".set.on")&&!document.querySelector("input:focus"))render()},30000);
</script>
