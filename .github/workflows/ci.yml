name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - run: uv export --frozen --no-dev --no-hashes -o /tmp/requirements.txt && uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack from the example config
        run: |
          docker compose up -d --build
      - name: UI, API and metrics answer
        run: |
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 2; done
          curl -fs localhost:8000/ | grep -q zaehler-agent
          curl -fs localhost:8000/api/config | grep -q '"meters"'
          curl -fs -X POST -H 'Content-Type: application/json' localhost:8000/api/meters -d '{"name":"t","title":"T","kind":"generic","image_url":"http://x/y.jpg","integer_digits":3,"decimals":1,"max_rate_per_hour":1}' | grep -q '"t"'
          curl -fs localhost:8000/metrics | grep -q '^zaehler_up 1'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t zaehler-agent:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zaehler-agent:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
