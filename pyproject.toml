[project]
name = "zaehler-agent"
version = "1.2.0"
description = "Liest Gas- und Wasserzaehler per Vision-Modell (OpenRouter) von den AI-on-the-edge-Kameras und meldet die Werte per MQTT an Home Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "paho-mqtt>=2.2.0",
    "pillow>=13.0.0",
    "pyyaml>=6.0.4",
    "uvicorn[standard]>=0.32.0",
]

# uv dev group (PEP 735): `uv sync` installs it, the container build uses
# `uv sync --no-dev`, so production never carries test and lint tools.
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=6.0.0",
    "respx>=0.23.1",
    "ruff>=0.8.0",
]

# Deployed application (uvicorn runs app.main:app), not a library.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Docstrings, comments and the prompt text are prose; the formatter keeps the code itself within 100.
ignore = ["E501"]
